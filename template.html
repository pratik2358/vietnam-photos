<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} — {{NAME}}</title>
<meta name="description" content="{{TITLE}}: photographs by {{NAME}}. Hà Nội, Ninh Bình, Sa Pa, Hội An and Đà Nẵng.">
<meta property="og:type" content="website">
<meta property="og:url" content="{{SITE_URL}}">
<meta property="og:title" content="{{TITLE}} — {{NAME}}">
<meta property="og:description" content="Photographs by {{NAME}}. Hà Nội, Ninh Bình, Sa Pa, Hội An and Đà Nẵng.">
<meta property="og:image" content="{{SITE_URL}}img/share.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Boats with lanterns on the river in Hội An at blue hour, under a full moon">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>
document.documentElement.classList.add('js');
// Night mode is a per-viewer choice; apply it before the page draws so it never flashes light.
try { if (localStorage.getItem('mode') === 'night') document.documentElement.classList.add('night'); } catch (e) {}
</script>
</head>
<body data-tone="light">

<button class="mode" type="button" aria-pressed="false" aria-label="Night mode" title="Night mode">
  <svg class="moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
  <svg class="sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></svg>
</button>

<header class="intro" id="top">
  {{SLIDESHOW}}
  <p class="kicker">Photographs</p>
  <h1 aria-label="{{TITLE}}">{{TITLE_ART}}</h1>
  <p class="by">{{NAME}}</p>
  <a class="ig" href="https://www.instagram.com/{{INSTAGRAM}}/" target="_blank" rel="noopener">Instagram @{{INSTAGRAM}}</a>
  <ol class="toc">{{NAV}}</ol>
  <a class="down" href="#hanoi" aria-label="Begin">&darr;</a>
</header>

<main>{{CHAPTERS}}</main>

{{ABOUT}}

<footer class="end">
  <p class="fin" aria-label="{{TITLE}}">{{TITLE_ART}}</p>
  <div class="gear"><p class="gear-k">Shot on</p><ul>{{GEAR}}</ul></div>
  <p>&copy; {{NAME}}</p>
  <a class="ig" href="https://www.instagram.com/{{INSTAGRAM}}/" target="_blank" rel="noopener">Instagram @{{INSTAGRAM}}</a>
  <a href="#top">back to top &uarr;</a>
</footer>

<div class="lb" hidden>
  <button class="lb-x" aria-label="Close">&times;</button>
  <button class="lb-fs" aria-label="Full screen"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5"><path class="fs-in" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/><path class="fs-out" d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg></button>
  <button class="lb-p" aria-label="Previous">&larr;</button>
  <img alt="">
  <button class="lb-n" aria-label="Next">&rarr;</button>
  <div class="lb-foot">
    <span class="lb-social" hidden>
      <button class="lb-like" type="button" aria-pressed="false" aria-label="Like"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 20.5s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.5 2.7c0 5.6-7.5 10.2-7.5 10.2z"/></svg><span></span></button>
      <button class="lb-talk" type="button" aria-label="Comments"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4.5 5.5h15v10h-9l-4 3.5v-3.5h-2z"/></svg><span></span></button>
    </span>
    <p class="lb-c"></p>
  </div>
  <aside class="lb-panel" hidden>
    <div class="lb-panel-head"><p>Comments</p><button class="lb-panel-x" type="button" aria-label="Close comments">&times;</button></div>
    <ol class="lb-comments"></ol>
    <p class="lb-empty" hidden>No comments yet.</p>
    <form>
      <input name="name" placeholder="Your name" maxlength="60" required autocomplete="name">
      <textarea name="text" placeholder="Say something about this photo" maxlength="1000" rows="3" required></textarea>
      <input name="website" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
      <button type="submit">Send</button>
      <p class="lb-note" aria-live="polite"></p>
    </form>
  </aside>
</div>

<script src="script.js"></script>
<script type="module" src="social.js"></script>
</body>
</html>
